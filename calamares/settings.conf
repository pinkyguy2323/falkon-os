# Calamares settings for Falkon OS (графическая установка)
# Работает одинаково для Desktop и Tiling. Core ставится через TUI (falkon-install) или тот же Calamares в текстовом режиме.
---
modules-search: [ local, /usr/lib/calamares/modules, /usr/share/calamares/modules ]
instances:
- id:     packagechooser
  module: packagechooser
  config: packagechooser.conf
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services
  - grubcfg
  - bootloader
  - packages
  - falkon-drivers
  - falkon-tweaks
  - umount
- show:
  - finished
branding: falkon
prompt-install: false
dont-chroot: false
