# Falkon OS - Hyprland по умолчанию (в духе Omarchy)
# Super+Enter=терминал, Super+D=меню, Super+Q=закрыть, Super+1..9=воркспейсы

monitor=,preferred,auto,1
exec-once = waybar
exec-once = hyprpaper
exec-once = mako
exec-once = wl-paste --watch cliphist store
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = falkon-welcome

$terminal = ghostty
$menu = wofi --show drun
$browser = firefox
source = ~/.config/hypr/falkon-theme.conf

general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
  col.inactive_border = rgba(3b4261aa)
  layout = dwindle
}

decoration {
  rounding = 10
  blur { enabled = true size = 4 passes = 2 }
  shadow { enabled = true range = 4 render_power = 3 }
}

animations {
  enabled = true
  bezier = myBezier, 0.05, 0.9, 0.1, 1.05
  animation = windows, 1, 7, myBezier
  animation = workspaces, 1, 6, myBezier
}

input {
  kb_layout = us,ru,ua
  kb_options = grp:alt_shift_toggle
  follow_mouse = 1
  touchpad { natural_scroll = true }
}

$mainMod = SUPER
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, W, exec, falkon-wallpaper next
bind = $mainMod SHIFT, W, exec, falkon-wallpaper gui
bind = $mainMod, T, exec, falkon-customizer
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, B, exec, $browser
bind = , PRINT, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
