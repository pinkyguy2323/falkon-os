ja|日本語|ja_JP.UTF-8
es|Español|es_ES.UTF-8
fr|Français|fr_FR.UTF-8
de|Deutsch|de_DE.UTF-8
pt|Português (BR)|pt_BR.UTF-8
ar|العربية|ar_SA.UTF-8
hi|हिन्दी|hi_IN.UTF-8
tr|Türkçe|tr_TR.UTF-8

