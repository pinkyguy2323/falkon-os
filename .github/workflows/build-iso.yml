# Falkon OS - автобилд ISO в облаке (тебе не нужен Linux!)
# Как работает: запушил тег v1.0 -> GitHub сам собрал ISO -> положил в Releases.
# Ручной запуск: вкладка Actions -> Build ISO -> Run workflow.
name: Build ISO

# Без этого GitHub режет создание Releases с 403 "Resource not accessible by integration"
permissions:
  contents: write
  actions: write

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Поставить зависимости
        run: pacman -Sy --noconfirm archiso git reflector rsync squashfs-tools dosfstools grub syslinux

      - name: Собрать ISO
        run: |
          chmod +x scripts/build-iso.sh scripts/falkon-*
          ./scripts/build-iso.sh falkon
          ls -lh out/

      - name: Залить ISO как артефакт (14 дней)
        uses: actions/upload-artifact@v4
        with:
          name: falkon-iso
          path: out/*.iso
          retention-days: 14

      # Только для тегов v* - создать Release с ISO (чтобы люди качали без git)
      - name: Release с ISO
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.iso
          body: |
            ## Falkon OS ${{ github.ref_name }} - one system, three looks
            Arch-based: KDE classic + Hyprland tiling + pure console (`sudo falkon-look kde|hypr|cmd`).
            25+25 themes, 12 languages, ghostty + vscode + firefox + claude-code + codex.
            Install: boot ISO -> "Install Falkon". Check: `sha256sum *.iso`
          draft: false
          prerelease: false
